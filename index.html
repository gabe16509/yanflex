<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - Regra 50/30/20</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --text: #eeeeee;
            --danger: #ff2e63;
            --warning: #ffcd56;
            --success: #21bf73; /* Verde semáforo */
            --fixed-label: #f9ad6d;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 95vw;
            max-width: 1200px;
            gap: 20px;
            padding: 20px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .top-row { grid-template-columns: 1fr; }
            .columns-container { grid-template-columns: 1fr !important; }
        }

        .sidebar, .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .columns-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: flex-start;
        }

        .column {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            min-height: 200px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .column-header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
        }

        h2, h3 { margin: 0; color: var(--accent); }

        .header-with-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #252525;
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid #333;
            transition: 0.3s;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .fixed-toggle.active {
            border-color: var(--fixed-label);
            color: var(--fixed-label);
            background: rgba(249, 173, 109, 0.1);
        }

        .category-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-option {
            background: #252525;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .cat-green { border-color: var(--success); color: var(--success); }
        .cat-yellow { border-color: var(--warning); color: var(--warning); }
        .cat-red { 
            border-color: var(--danger); 
            color: var(--danger); 
            cursor: not-allowed; 
            opacity: 0.6;
        }

        .category-option.selected {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.3);
            border-color: var(--accent);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            outline: none;
        }

        button {
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        ul { list-style: none; padding: 0; }
        li {
            background: #2a2a2a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
        }

        .li-header { display: flex; justify-content: space-between; font-weight: 600; }
        .btn-delete { color: #555; cursor: pointer; }
        .btn-delete:hover { color: var(--danger); }

        #balanceDisplay { font-size: 3rem; margin: 10px 0; font-weight: 800; }
        .limit-info { font-size: 0.8rem; display: flex; flex-direction: column; gap: 2px; margin-top: 5px; }
        .remaining-val { font-weight: bold; font-size: 0.9rem; }
        
        #alertMsg { color: var(--danger); font-size: 0.8rem; margin-bottom: 10px; display: none; text-align: center; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="top-row">
            <aside class="sidebar">
                <h2>Configurações</h2>
                <div class="input-group">
                    <label style="font-size: 0.85rem; color: #888;">Renda Mensal Total</label>
                    <input type="number" id="incomeInput" placeholder="Ex: 5000">
                </div>
                <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
                
                <div class="header-with-toggle">
                    <h3>Novo Gasto</h3>
                    <div id="fixedBtn" class="fixed-toggle">
                        <i id="fixedIcon" class="fas fa-unlock"></i>
                        <span id="fixedLabel">Variável</span>
                    </div>
                </div>

                <div id="alertMsg"></div>
                
                <div class="category-selector" id="categorySelector">
                    <div class="category-option" id="opt-50" data-rule="50">
                        <i class="fas fa-house"></i>
                        <span>50%</span>
                    </div>
                    <div class="category-option" id="opt-30" data-rule="30">
                        <i class="fas fa-star"></i>
                        <span>30%</span>
                    </div>
                    <div class="category-option" id="opt-20" data-rule="20">
                        <i class="fas fa-piggy-bank"></i>
                        <span>20%</span>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="descInput" placeholder="Descrição">
                    <input type="number" id="amountInput" placeholder="Valor (R$)">
                    <button id="addBtn">Adicionar Gasto</button>
                </div>
            </aside>

            <div class="stat-card">
                <span>Saldo Disponível Geral</span>
                <h2 id="balanceDisplay">R$ 0,00</h2>
                <p id="summaryText" style="font-size: 0.9rem; color: #888;"></p>
            </div>
        </div>

        <div class="columns-container">
            <div class="column">
                <div class="column-header">
                    <h3>Necessidades (50%)</h3>
                    <div class="limit-info">
                        <span id="limit-50">Limite: R$ 0,00</span>
                        <span class="remaining-val" id="rem-50">Resta: R$ 0,00</span>
                    </div>
                    <div class="progress-container"><div id="bar-50" class="progress-bar"></div></div>
                </div>
                <ul id="list-50"></ul>
            </div>

            <div class="column">
                <div class="column-header">
                    <h3>Desejos (30%)</h3>
                    <div class="limit-info">
                        <span id="limit-30">Limite: R$ 0,00</span>
                        <span class="remaining-val" id="rem-30">Resta: R$ 0,00</span>
                    </div>
                    <div class="progress-container"><div id="bar-30" class="progress-bar"></div></div>
                </div>
                <ul id="list-30"></ul>
            </div>

            <div class="column">
                <div class="column-header">
                    <h3>Futuro (20%)</h3>
                    <div class="limit-info">
                        <span id="limit-20">Limite: R$ 0,00</span>
                        <span class="remaining-val" id="rem-20">Resta: R$ 0,00</span>
                    </div>
                    <div class="progress-container"><div id="bar-20" class="progress-bar"></div></div>
                </div>
                <ul id="list-20"></ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0FozURr49l3Kfjmx7S1fpWAIJ6YS91eU",
            authDomain: "project0-f835d.firebaseapp.com",
            databaseURL: "https://project0-f835d-default-rtdb.firebaseio.com",
            projectId: "project0-f835d",
            storageBucket: "project0-f835d.firebasestorage.app",
            messagingSenderId: "86377009422",
            appId: "1:86377009422:web:68e91cd7a647c84002c75f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const expensesRef = ref(db, 'expenses');
        const incomeRef = ref(db, 'monthlyIncome');

        let selectedRule = null;
        let isFixed = false;
        let categoryStatus = { '50': false, '30': false, '20': false };

        document.getElementById('fixedBtn').onclick = () => {
            isFixed = !isFixed;
            document.getElementById('fixedBtn').classList.toggle('active', isFixed);
            document.getElementById('fixedIcon').className = isFixed ? 'fas fa-lock' : 'fas fa-unlock';
            document.getElementById('fixedLabel').innerText = isFixed ? 'Fixo' : 'Variável';
        };

        document.querySelectorAll('.category-option').forEach(option => {
            option.onclick = function() {
                const rule = this.getAttribute('data-rule');
                if (categoryStatus[rule]) {
                    showAlert("Esta categoria está lotada!");
                    return;
                }
                document.getElementById('alertMsg').style.display = 'none';
                document.querySelectorAll('.category-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedRule = rule;
            }
        });

        function showAlert(msg) {
            const el = document.getElementById('alertMsg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        document.getElementById('addBtn').onclick = function() {
            const desc = document.getElementById('descInput').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            
            if (!selectedRule) return showAlert("Selecione uma categoria!");
            if (!desc || isNaN(amount)) return showAlert("Preencha descrição e valor!");

            push(expensesRef, { desc, amount, isFixed, rule: selectedRule, timestamp: Date.now() });
            
            // Limpa os campos de texto
            document.getElementById('descInput').value = '';
            document.getElementById('amountInput').value = '';
            
            // LIMPA A CATEGORIA SELECIONADA PARA EVITAR ADIÇÃO ERRADA
            selectedRule = null;
            document.querySelectorAll('.category-option').forEach(opt => opt.classList.remove('selected'));
        };

        document.getElementById('incomeInput').onchange = (e) => set(incomeRef, parseFloat(e.target.value) || 0);
        window.deleteExpense = (id) => remove(ref(db, `expenses/${id}`));

        onValue(incomeRef, (snap) => {
            const inc = snap.val() || 0;
            document.getElementById('incomeInput').value = inc;
            onValue(expensesRef, (expSnap) => updateUI(expSnap.val(), inc));
        });

        onValue(expensesRef, (snap) => {
            const inc = parseFloat(document.getElementById('incomeInput').value) || 0;
            updateUI(snap.val(), inc);
        });

        function updateUI(data, income) {
            const totals = { '50': 0, '30': 0, '20': 0 };
            const lists = { '50': document.getElementById('list-50'), '30': document.getElementById('list-30'), '20': document.getElementById('list-20') };
            Object.values(lists).forEach(l => l.innerHTML = '');

            if (data) {
                Object.entries(data).forEach(([id, exp]) => {
                    totals[exp.rule] += exp.amount;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="li-header"><span>${exp.desc}</span><span>R$ ${exp.amount.toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; margin-top:5px">
                            <small style="color:${exp.isFixed?'var(--fixed-label)':'var(--accent)'}">${exp.isFixed?'Fixo':'Variável'}</small>
                            <i class="fas fa-trash-alt btn-delete" onclick="deleteExpense('${id}')"></i>
                        </div>`;
                    lists[exp.rule].appendChild(li);
                });
            }

            ['50', '30', '20'].forEach(rule => {
                const limit = income * (parseInt(rule)/100);
                const spent = totals[rule];
                const remaining = limit - spent;
                const perc = limit > 0 ? (spent / limit) * 100 : 0;
                
                document.getElementById(`limit-${rule}`).innerText = `Limite: R$ ${limit.toFixed(2)}`;
                const remEl = document.getElementById(`rem-${rule}`);
                remEl.innerText = `Resta: R$ ${remaining.toFixed(2)}`;
                remEl.style.color = remaining < 0 ? 'var(--danger)' : 'var(--success)';

                const bar = document.getElementById(`bar-${rule}`);
                const opt = document.getElementById(`opt-${rule}`);
                
                bar.style.width = Math.min(perc, 100) + '%';
                opt.classList.remove('cat-green', 'cat-yellow', 'cat-red');

                if (perc >= 100) {
                    bar.style.backgroundColor = 'var(--danger)';
                    opt.classList.add('cat-red');
                    categoryStatus[rule] = true;
                    if(selectedRule === rule) {
                        selectedRule = null;
                        opt.classList.remove('selected');
                    }
                } else if (perc >= 70) {
                    bar.style.backgroundColor = 'var(--warning)';
                    opt.classList.add('cat-yellow');
                    categoryStatus[rule] = false;
                } else {
                    bar.style.backgroundColor = 'var(--success)';
                    opt.classList.add('cat-green');
                    categoryStatus[rule] = false;
                }
            });

            const totalSpent = Object.values(totals).reduce((a, b) => a + b, 0);
            const balance = income - totalSpent;
            const balEl = document.getElementById('balanceDisplay');
            balEl.innerText = `R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            balEl.style.color = balance < 0 ? 'var(--danger)' : 'var(--success)';
        }
    </script>
</body>
</html>
