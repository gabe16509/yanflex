<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --text: #eeeeee;
            --danger: #ff2e63;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            width: 90vw;
            max-width: 1000px;
            gap: 20px;
            padding: 20px;
        }

        .sidebar, .dashboard {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex: 1;
            min-width: 340px;
        }

        h2, h3 { margin-top: 0; color: var(--accent); }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        label { font-size: 0.9rem; opacity: 0.8; }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #008d94; }

        .expense-list-container {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            border-top: 1px solid #333;
        }

        ul { list-style: none; padding: 0; }

        li {
            background: #2a2a2a;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: #252525;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #balanceDisplay { font-size: 2.2rem; margin: 10px 0; }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <h2>Configurações</h2>
            <div class="input-group">
                <label>Renda Mensal Total (R$)</label>
                <input type="number" id="incomeInput" placeholder="Ex: 5000" value="0">
            </div>

            <hr>

            <h3>Adicionar Despesa</h3>
            <div class="input-group">
                <input type="text" id="descInput" placeholder="Descrição (Ex: Mercado)">
                <input type="number" id="amountInput" placeholder="Valor (R$)">
                <button onclick="addExpense()">Adicionar Despesa</button>
            </div>

            <div class="expense-list-container">
                <ul id="expenseList"></ul>
            </div>
        </aside>

        <main class="dashboard">
            <div class="stat-card">
                <span>Saldo Restante</span>
                <h2 id="balanceDisplay">R$ 0,00</h2>
            </div>
            
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        let expenses = [];
        let myChart;

        // Cores vibrantes
        const chartColors = [
            '#36a2eb', // Saldo (Azul)
            '#ff6384', // Rosa
            '#ff9f40', // Laranja
            '#4bc0c0', // Ciano
            '#9966ff', // Roxo
            '#ffcd56', // Amarelo
            '#c9cbcf'  // Cinza
        ];

        const ctx = document.getElementById('expenseChart').getContext('2d');
        
        function initChart() {
            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Saldo Disponível (100%)'],
                    datasets: [{
                        data: [100],
                        backgroundColor: chartColors,
                        borderColor: '#1e1e1e',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#eeeeee', padding: 20 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` R$ ${context.parsed.toFixed(2)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function addExpense() {
            const descEl = document.getElementById('descInput');
            const amountEl = document.getElementById('amountInput');
            const description = descEl.value;
            const amount = parseFloat(amountEl.value);

            if (description && amount > 0) {
                expenses.push({ description, amount });
                descEl.value = '';
                amountEl.value = '';
                updateUI();
            } else {
                alert("Insira uma descrição e um valor válido.");
            }
        }

        function updateUI() {
            const income = parseFloat(document.getElementById('incomeInput').value) || 0;
            const list = document.getElementById('expenseList');
            list.innerHTML = '';

            let totalExpenses = 0;
            const values = [];

            // Primeiro calculamos o total de despesas
            expenses.forEach(exp => totalExpenses += exp.amount);

            const balance = income - totalExpenses;
            const displayBalance = balance < 0 ? 0 : balance;
            
            // O divisor para a porcentagem deve ser a renda total (ou a soma dos itens se a renda for 0)
            const totalForPercentage = Math.max(income, totalExpenses);

            const chartLabels = [];
            const chartValues = [];

            // Gerar labels com porcentagens para as despesas
            expenses.forEach((exp) => {
                const perc = totalForPercentage > 0 ? ((exp.amount / totalForPercentage) * 100).toFixed(1) : 0;
                chartLabels.push(`${exp.description} (${perc}%)`);
                chartValues.push(exp.amount);
                
                // Lista lateral
                const li = document.createElement('li');
                li.innerHTML = `<span>${exp.description}</span> <strong>R$ ${exp.amount.toFixed(2)}</strong>`;
                list.appendChild(li);
            });

            // Adicionar Saldo Restante com porcentagem
            const balancePerc = totalForPercentage > 0 ? ((displayBalance / totalForPercentage) * 100).toFixed(1) : 0;
            chartLabels.push(`Saldo Restante (${balancePerc}%)`);
            chartValues.push(displayBalance);

            // Atualizar Saldo no Card
            const balanceEl = document.getElementById('balanceDisplay');
            balanceEl.innerText = `R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            balanceEl.style.color = balance < 0 ? '#ff2e63' : '#00adb5';

            // Atualizar Gráfico
            myChart.data.labels = chartLabels;
            myChart.data.datasets[0].data = chartValues;
            
            // Cores dinâmicas (Despesas ganham cores do índice 1 em diante, Saldo ganha a cor 0)
            const dynamicColors = [...chartColors.slice(1, chartValues.length), chartColors[0]];
            myChart.data.datasets[0].backgroundColor = dynamicColors;

            myChart.update();
        }

        document.getElementById('incomeInput').addEventListener('input', updateUI);
        initChart();
    </script>
</body>
</html>
